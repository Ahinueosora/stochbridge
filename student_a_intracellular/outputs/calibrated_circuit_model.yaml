name: crp_lac_circuit_A5_calibrated
version: A5 calibrated (24 Nov 2026), on A3 v3
description: A3 v3 circuit with noise parameters calibrated in A5 (PETRI-seq GSE141018 exp 2.01 + Yu 2006). Deterministic behaviour
  unchanged (Y_max, rho, thresholds identical); noise changed. Use this file, not circuit_model.yaml, from A5 on (A6, Student B Module
  4).
changes_from_v2:
- 'crp_free_basal = 1/240 (Kuhlman Table 2): a crp knockout keeps a small lac output instead of exactly 0'
- edges re-labelled with validated_by from network v3 (A2, RegulonDB 14.5.1 grade, Kuhlman intervention, Ozbudak)
- 'context_edges: RegulonDB regulators around the circuit (not simulated)'
- SBML rewritten for COPASI + GillesPy2 (molecule counts, minutes), checked in both
units:
  time: min
  species: molecules per cell
  TMG_ext: uM
  glucose: uM
inputs:
  TMG_ext: extracellular TMG (uM)
  glucose: extracellular glucose (uM)
  crp_knockout: 'bool: crp (or cyaA) deleted'
species:
  P_free:
    description: lac promoter not bound by LacI (0 or 1 copy)
    initial_uninduced: 0
    initial_induced: 1
  P_rep:
    description: lac promoter bound by LacI (0 or 1 copy); P_free + P_rep = 1
    initial_uninduced: 1
    initial_induced: 0
  M:
    description: lacZYA mRNA (molecules)
    initial_uninduced: 0
    initial_induced: 1
  Y:
    description: LacY permease (molecules)
    initial_uninduced: 9
    initial_induced: 1506
  X:
    description: internal TMG (molecules); u = X/x0 inactivates LacI
    initial_uninduced: 0
    initial_induced: 25000
initial_conditions_note: uninduced = Ozbudak's OFF history (grown without TMG), induced = ON history (pre-grown fully induced); values
  at 0 glucose. Use rn.initial_state(p, induced, G, crp_knockout) for others.
reactions:
- id: R1_repress
  reactants:
    P_free: 1
  products:
    P_rep: 1
  propensity: k_rep_max / (1 + (X / x0)^n) * P_free
- id: R2_derepress
  reactants:
    P_rep: 1
  products:
    P_free: 1
  propensity: k_unrep * P_rep
- id: R3_transcribe
  reactants:
    P_free: 1
  products:
    P_free: 1
    M: 1
  propensity: k_tx_eff * P_free
- id: R4_mrna_decay
  reactants:
    M: 1
  products: {}
  propensity: d_m * M
- id: R5_translate
  reactants:
    M: 1
  products:
    M: 1
    Y: 1
  propensity: k_tl * M
- id: R6_lacY_dilute
  reactants:
    Y: 1
  products: {}
  propensity: d_y * Y
- id: R7_uptake
  reactants:
    Y: 1
  products:
    Y: 1
    X: 1
  propensity: k_up_eff * Y
- id: R8_tmg_loss
  reactants:
    X: 1
  products: {}
  propensity: d_x * X
