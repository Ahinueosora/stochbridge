name: crp_lac_circuit_A3
units:
  time: min
  species: molecules per cell
  TMG_ext: uM
  glucose: uM
inputs:
  TMG_ext: extracellular TMG (uM)
  glucose: extracellular glucose (uM)
edges:
- source: CRP-cAMP
  target: P_lac
  sign: +
  provenance: 'published_intervention: Kuhlman et al. 2007 PNAS 104:6043 Fig 1b (dcyaA
    dcpdA dlacY, cAMP titration at 1 mM IPTG; 201x rise 0 -> 1 mM, flat in dcrp);
    also RegulonDB + Ozbudak Fig 3b'
  evidence: published_intervention
  a2_validated: false
  a2_note: lacZYA showed no CRP-perturbation effect in PRECISE-1K (no inducer in any
    sample)
  quantitative_check: output close to linear in CRP occupancy (Hill m = 1.15, CI 1.03-1.28;
    paper 1.0 +/- 0.1), as in R3
- source: CRP-cAMP
  target: LacI-P_lac loop
  sign: + (tighter repression)
  provenance: 'published_intervention: Kuhlman et al. 2007 Fig 2a (looping L vs cAMP;
    Omega = 12.4, CI 10.2-15.4 refit, paper 10.3)'
  evidence: published_intervention
  a2_validated: false
  model_term: 'rho_eff in R1; default applies it to crp knockout only (rho 170 ->
    ~22); glucose form (rho_crp_coupling: glucose) fails Ozbudak Fig 2c, see fitted_params
    sensitivity'
