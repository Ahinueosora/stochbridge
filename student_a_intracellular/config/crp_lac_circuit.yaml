species:
  P_free:
    initial: 0
  P_rep:
    initial: 1
  M:
    initial: 0
  Y:
    initial: 9
  X:
    initial: 0
parameters:
  rho: 170.0
  rho_crp_coupling: knockout
  loop_L0: 3.91
  loop_omega: 12.4
  crp_occ_ref: 0.76
  k_unrep: 0.1
  n: 2.0
  x0: 500.0
  k_tx: 0.58
  d_m: 0.46
  k_tl: 9.2
  doubling_min: 90.0
  d_x: 0.5
  k_up: 1.8441181768348565
  uptake_form: power
  uptake_h: 0.6
  uptake_K: 680.0
  crp_min: 0.2
  crp_K: 3.888148753814075
  excl_min: 0.65
  excl_K: 7.425548389869606
derived:
  Y_max_LacY_molecules: 1506.1736226880776
  basal_LacY_molecules: 8.859844839341633
  k_rep_max_per_min: 16.900000000000002
  d_y_per_min: 0.007701635339554948
  rho_by_condition:
    no_glucose: 170.0
    glucose_1mM: 170.0
    crp_knockout: 22.393927330929735
  switching_drives:
  - 25.922498885010626
  - 85.50598816098598
input_functions:
  c_crp: crp_min + (1 - crp_min) / (1 + glucose / crp_K)
  beta_G: excl_min + (1 - excl_min) / (1 + glucose / excl_K)
  beta_T: TMG_ext ** uptake_h   (power law, uM units)
  rho_eff: 1 + (rho - 1) * (1 + L(theta)) / (1 + L(crp_occ_ref)), L(theta) = loop_L0
    * (1 + (loop_omega - 1) * theta); theta = 0 for crp knockout; with rho_crp_coupling
    'glucose' also theta = crp_occ_ref * c_crp(glucose); otherwise rho_eff = rho
reactions:
- id: R1_repress
  reactants:
    P_free: 1
  products:
    P_rep: 1
  propensity: k_rep_max(glucose) / (1 + (X/x0)**n) * P_free,  k_rep_max = (rho_eff(glucose)
    - 1) * k_unrep
  k_rep_max_no_glucose: 16.900000000000002
  k_rep_max_glucose_1mM: 16.900000000000002
- id: R2_derepress
  reactants:
    P_rep: 1
  products:
    P_free: 1
  propensity: k_unrep * P_rep
- id: R3_transcribe
  reactants:
    P_free: 1
  products:
    P_free: 1
    M: 1
  propensity: k_tx * c_crp(glucose) * P_free
- id: R4_mrna_decay
  reactants:
    M: 1
  products: {}
  propensity: d_m * M
- id: R5_translate
  reactants:
    M: 1
  products:
    M: 1
    Y: 1
  propensity: k_tl * M
- id: R6_lacY_dilute
  reactants:
    Y: 1
  products: {}
  propensity: ln(2)/doubling_min * Y
- id: R7_uptake
  reactants:
    Y: 1
  products:
    Y: 1
    X: 1
  propensity: k_up * beta_T(TMG_ext) * beta_G(glucose) * Y
- id: R8_tmg_loss
  reactants:
    X: 1
  products: {}
  propensity: d_x * X
